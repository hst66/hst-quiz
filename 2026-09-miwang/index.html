const card=document.getElementById('card')
function showChoice(){
  card.className='card fade'
  card.innerHTML='<img src="'+images['00']+'" alt="心理測驗選擇頁，四條道路分別為 A 海邊晨光、B 林間小徑、C 城市夜路、D 雲霧山階">'+
    '<button class="hotspot choice-a" aria-label="選擇 A 海邊晨光" data-choice="A"></button>'+
    '<button class="hotspot choice-b" aria-label="選擇 B 林間小徑" data-choice="B"></button>'+
    '<button class="hotspot choice-c" aria-label="選擇 C 城市夜路" data-choice="C"></button>'+
    '<button class="hotspot choice-d" aria-label="選擇 D 雲霧山階" data-choice="D"></button>'
  card.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>showAnswer(button.dataset.choice)))
}
function showAnswer(choice){
  card.className='card fade'
  card.innerHTML='<img src="'+images[choice]+'" alt="心理測驗 '+choice+' 完整解答">'+
    '<button class="hotspot restart" aria-label="重新選擇"></button>'
  card.querySelector('.restart').addEventListener('click',showChoice)
}
showChoice()
</script>
