const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mount(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});const focus=app.querySelector('h1');if(focus){focus.tabIndex=-1;focus.focus({preventScroll:true});}}
function showQuestion(n){step=n;const q=questions[n];mount(`<section class="quiz fade"><div class="quiz-top"><span>火象星座・留一點光給自己</span><span>0${n+1} / 03</span></div><div class="progress"><div style="width:${(n+1)/3*100}%"></div></div><div class="eyebrow">QUESTION 0${n+1}</div><h1>${q.title}</h1><p class="hint">${q.hint}</p><div class="options" role="group" aria-label="選擇妳的答案">${q.options.map((o,i)=>`<button class="option" data-choice="${i}" aria-pressed="${answers[n]===i}"><span class="letter">${String.fromCharCode(65+i)}</span><span><strong>${o[0]}</strong><small>${o[1]}</small></span><span class="tick" aria-hidden="true">${answers[n]===i?'✓':''}</span></button>`).join('')}</div><div class="actions">${n===0?'<span class="tiny">共三題，跟著直覺選就好。</span>':'<button class="back" id="back">← 回上一題</button>'}<button class="btn" id="next" ${answers[n]===null?'disabled':''}>${n===2?'看看我的結果':'下一題'} <span>→</span></button></div><p class="note">沒有標準答案，選接近現在的妳就好。</p></section>`);app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[n]=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{const chosen=Number(x.dataset.choice)===answers[n];x.setAttribute('aria-pressed',String(chosen));x.querySelector('.tick').textContent=chosen?'✓':''});document.getElementById('next').disabled=false});if(n>0)document.getElementById('back').onclick=()=>showQuestion(n-1);document.getElementById('next').onclick=()=>{if(answers[n]===null)return;if(n<2)showQuestion(n+1);else showResult()}}
function getResult(a){if(a.length!==3||!a.every((v,i)=>Number.isInteger(v)&&v>=0&&v<questions[i].options.length))throw Error('請完成三題');return {profile:results[a[0]],drain:drains[a[1]],action:actions[a[2]]}}
function showResult(){const {profile:r,drain:d,action:a}=getResult(answers);step=3;const url='https://omnicrystal.store/shop/'+r.path+'?utm_source=ting&utm_medium=message';mount(`<article class="result fade"><div class="result-intro"><div class="eyebrow">A NOTE FOR YOU</div><div class="type">${r.tag}</div><h1>${r.title}</h1><p>${r.intro}</p><div class="result-banner">${r.quote}</div></div><div class="insights"><section class="insight"><div class="eyebrow">WHAT YOU MAY NEED</div><h3>${r.need}</h3><p>${r.body}</p></section><section class="insight"><div class="eyebrow">依妳的第二題選擇</div><h3>${d.title}</h3><p>${d.body}</p></section></div><section class="action-box"><div class="eyebrow">這禮拜，先做一件小事 · 依妳的第三題選擇</div><h3>${a.title}</h3><p>${a.body}</p></section><section class="bridge"><div class="eyebrow">A LITTLE REMINDER TO WEAR</div><h2>替現在的自己，<br>留一個小小的記號。</h2><p>除了剛才那個小行動，也可以選一件喜歡的飾品，<br>把這份心意留在日常裡。<br>先喜歡它的樣子，再看看它的寓意。</p></section><section class="product" style="--tint:${r.tint}"><a class="product-art product-photo" href="${esc(url)}" target="_blank" rel="noopener sponsored" aria-label="查看${r.product}商品頁"><img src="${r.image}" alt="${r.product}水晶手鍊，森靈水晶官方商品照片" loading="eager" decoding="async"><span>森靈水晶・${r.product}</span></a><div class="product-info"><div class="eyebrow">TING'S CRYSTAL SELECTION</div><h2>${r.product}</h2><div class="stones">${r.stones}</div><p class="why">${r.why}</p><div class="reasons">${r.reasons.map(x=>`<div>${x}</div>`).join('')}</div><div class="price">${r.price}</div><p class="price-note">不同規格價格可能不同，實際價格與庫存以商店為準。</p><div class="coupon"><div><span class="coupon-label">給妳的一份小心意</span><p>結帳輸入推薦碼 <strong>TING</strong><br>折扣 <b>NT$100</b></p></div><span id="copy-status" class="copy-status" role="status" aria-live="polite"></span></div><div class="shop-actions"><button id="copy-code" class="btn secondary" aria-label="複製推薦碼 TING，折扣100元">複製推薦碼 TING <span>− NT$100</span></button><a class="btn product-cta" href="${esc(url)}" target="_blank" rel="noopener sponsored">前往商品頁 <span>↗</span></a></div><div class="tiny" style="margin-top:10px">前往森靈水晶商品頁・含 Ting 推薦來源</div></div></section><section class="end"><p>妳不用急著做決定。<br>喜歡這份寓意，也喜歡它的樣子，再慢慢選就好。</p><button class="back" id="retry">重新測一次 ↻</button><p style="margin-top:28px">Ting · 陪迷惘的人，看見原來還有選擇。</p></section><div class="disclaimer">本測驗為娛樂與自我探索用途，不是心理診斷或命理判定。水晶推薦依設計與品牌的文化寓意整理，不保證改變感情、健康、財運或其他結果。</div></article>`);document.getElementById('copy-code').onclick=async()=>{const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText('TING');status.textContent='已複製 TING，結帳時貼上即可。';document.getElementById('copy-code').textContent='已複製 ✓'}catch{status.textContent='推薦碼：TING，可長按上方文字複製。'}};document.getElementById('retry').onclick=()=>{answers=[null,null,null];showQuestion(0)}}
document.getElementById('home').onclick=e=>{e.preventDefault();showQuestion(0)};showQuestion(0);
</script></body></html>
